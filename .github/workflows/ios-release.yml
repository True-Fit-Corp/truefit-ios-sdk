# iOS release workflow — lives in the PUBLIC repo True-Fit-Corp/truefit-ios-sdk
# at .github/workflows/ios-release.yml. (This copy under consumer-sdk/tools is
# the source of truth; copy it into the iOS repo when it changes.)
#
# Triggered by GitLab CI (tools/ios-dispatch.sh) via repository_dispatch. GitLab
# archives the private ios-sdk source to GCS and passes a short-lived signed URL;
# this workflow downloads it, builds the XCFramework on a macOS runner, cuts the
# release, and pushes to CocoaPods trunk — reusing the SDK's own publish-ios.sh.
#
# Repo secret required:
#   COCOAPODS_TRUNK_TOKEN — CocoaPods trunk session token
# (GITHUB_TOKEN is provided automatically and is used for the release + git push.)
name: ios-release

on:
  repository_dispatch:
    types: [ios-release]

# Surface version + correlation in the run title so the GitLab dispatcher can
# find and poll this exact run.
run-name: "ios-release ${{ github.event.client_payload.version }} (${{ github.event.client_payload.correlation }})"

permissions:
  contents: write        # create the release, push the Package.swift commit + tag

jobs:
  build-and-publish:
    runs-on: macos-14
    env:
      VERSION: ${{ github.event.client_payload.version }}
      SRC_URL: ${{ github.event.client_payload.src_url }}
      # publish-ios.sh clones/pushes truefit-ios-sdk and cuts its release; the
      # built-in token has that access since the workflow runs in that repo.
      GH_TOKEN: ${{ github.token }}
      COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
    steps:
      - name: Validate payload
        run: |
          set -euo pipefail
          [ -n "$VERSION" ] || { echo "missing version in payload" >&2; exit 1; }
          [ -n "$SRC_URL" ] || { echo "missing src_url in payload" >&2; exit 1; }
          echo "Building iOS SDK $VERSION"

      - name: Download & extract source
        run: |
          set -euo pipefail
          curl -sSf "$SRC_URL" -o /tmp/ios-src.tgz
          mkdir -p src && tar xzf /tmp/ios-src.tgz -C src
          # archive root is `ios-sdk/`
          test -f src/ios-sdk/scripts/publish-ios.sh

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build & publish (XCFramework -> release + SPM + CocoaPods)
        working-directory: src/ios-sdk
        run: bash scripts/publish-ios.sh
